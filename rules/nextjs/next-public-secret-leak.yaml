rules:
  - id: nextjs-secret-in-next-public-env
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      A secret-looking value is read from a NEXT_PUBLIC_ environment variable.
      Everything prefixed NEXT_PUBLIC_ is inlined into the client bundle and
      shipped to every visitor. Secrets must be read from a non-public env var
      in server code only (Route Handlers, Server Actions, getServerSideProps).
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      owasp: "A05:2021 - Security Misconfiguration"
      references:
        - https://nextjs.org/docs/app/building-your-application/configuring/environment-variables
    patterns:
      - pattern: process.env.$VAR
      - metavariable-regex:
          metavariable: $VAR
          regex: NEXT_PUBLIC_.*(SECRET|TOKEN|KEY|PASSWORD|PRIVATE|CREDENTIAL).*
