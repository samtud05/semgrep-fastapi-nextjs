rules:
  - id: nextjs-hardcoded-credential
    languages: [typescript, javascript]
    severity: WARNING
    message: >
      A credential-looking constant is assigned a hardcoded string. Committed
      secrets leak through git history and client bundles. Load it from the
      environment (server-side only) instead.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: const $NAME = "..."
          - pattern: let $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(api_?key|secret|token|password|private_?key|auth_?token)$
