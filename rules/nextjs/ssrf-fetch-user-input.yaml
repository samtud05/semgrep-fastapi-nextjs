rules:
  - id: nextjs-ssrf-server-fetch-from-request
    languages: [tsx, typescript, javascript]
    severity: WARNING
    message: >
      Server-side fetch() targets a URL taken directly from the request. If the
      URL is attacker-controlled this is SSRF — the server can be made to call
      internal services or cloud metadata endpoints. Validate against an
      allowlist of hosts before fetching.
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery"
      references:
        - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    pattern-either:
      - pattern: fetch(req.query.$P)
      - pattern: fetch($REQ.searchParams.get(...))
      - pattern: fetch(req.body.$P)
