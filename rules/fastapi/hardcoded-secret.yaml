rules:
  - id: fastapi-hardcoded-secret-key
    languages: [python]
    severity: WARNING
    message: >
      A secret/signing key is assigned a hardcoded string literal. Secrets in
      source get committed, leaked, and shared. Load it from the environment or
      a secrets manager: SECRET_KEY = os.environ["SECRET_KEY"].
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    pattern-either:
      - pattern: SECRET_KEY = "..."
      - pattern: JWT_SECRET = "..."
      - patterns:
          - pattern: $X.secret_key = "..."
          - metavariable-regex:
              metavariable: $X
              regex: (?i).*(app|config|settings|jwt|auth).*
