rules:
  - id: fastapi-jwt-signature-verification-disabled
    languages: [python]
    severity: ERROR
    message: >
      JWT decoded with signature verification turned off. An attacker can forge
      any token and impersonate any user. Remove verify_signature=False and
      always decode with the expected algorithms, e.g.
      jwt.decode(token, key, algorithms=["RS256"]).
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A02:2021 - Cryptographic Failures"
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...})'
      - pattern: 'jwt.decode(..., verify=False, ...)'
