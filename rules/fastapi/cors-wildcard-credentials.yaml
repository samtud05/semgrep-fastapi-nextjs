rules:
  - id: fastapi-cors-wildcard-with-credentials
    languages: [python]
    severity: ERROR
    message: >
      CORSMiddleware allows any origin ("*") together with allow_credentials=True.
      Browsers forbid this combination for a reason: it would let any site make
      credentialed cross-origin requests to this API. Pin allow_origins to an
      explicit list of trusted origins.
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      references:
        - https://fastapi.tiangolo.com/tutorial/cors/
    patterns:
      - pattern: |
          $APP.add_middleware(CORSMiddleware, ..., allow_origins=$ORIGINS, ..., allow_credentials=True, ...)
      - metavariable-pattern:
          metavariable: $ORIGINS
          patterns:
            - pattern-either:
                - pattern: '["*"]'
                - pattern: '"*"'
